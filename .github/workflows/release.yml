name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-24.04
    permissions:
      contents: write # create the GitHub Release and upload assets
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # git-cliff needs all commits and release tags
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends luajit lua-check shellcheck zip unzip
      - name: Verify version consistency
        run: |
          version=$(sed -n 's/^ *version = "\([0-9][0-9.]*\)",$/\1/p' arxiv.koplugin/_meta.lua)
          test "v$version" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME != _meta.lua v$version"; exit 1; }
          echo "VERSION=$version" >> "$GITHUB_ENV"
      - name: Generate changelog and release notes
        run: |
          cargo install git-cliff --version 2.10.1 --locked
          git-cliff --output CHANGELOG.md
          grep -q "^## \[$VERSION\]" CHANGELOG.md
          git-cliff --current --strip header --output "$RUNNER_TEMP/version_notes.md"
          cat docs/quickstart.md > "$RUNNER_TEMP/release-notes.md"
          echo "" >> "$RUNNER_TEMP/release-notes.md"
          cat "$RUNNER_TEMP/version_notes.md" >> "$RUNNER_TEMP/release-notes.md"
          echo "" >> "$RUNNER_TEMP/release-notes.md"
          printf '\nFull changelog: https://github.com/%s/blob/%s/CHANGELOG.md\n' \
            "$GITHUB_REPOSITORY" "$GITHUB_REF_NAME" >> "$RUNNER_TEMP/release-notes.md"
      - name: Test
        run: scripts/check.sh
      - name: Package
        run: scripts/package.sh
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          checksum=$(cut -d' ' -f1 "dist/arxiv.koplugin-$GITHUB_REF_NAME.zip.sha256")
          printf '\nSHA-256: `%s`\n' "$checksum" >> "$RUNNER_TEMP/release-notes.md"
          gh release create "$GITHUB_REF_NAME" --verify-tag --title "arxiv.koplugin $GITHUB_REF_NAME" \
            --notes-file "$RUNNER_TEMP/release-notes.md" \
            "dist/arxiv.koplugin-$GITHUB_REF_NAME.zip" "dist/arxiv.koplugin-$GITHUB_REF_NAME.zip.sha256"
